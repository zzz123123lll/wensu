<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文序</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">

  <div id="topbar">
    <span class="brand">文序</span>
    <button class="icon-btn drawer-btn" id="btn-drawer-proj" title="项目" aria-label="打开项目列表">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4l4 4-4 4M7 12h7"/></svg>
    </button>
    <span id="doc-title">选择一篇草稿开始</span>
    <button class="icon-btn drawer-btn" id="btn-drawer-helper" title="写作助手" aria-label="打开写作助手">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 14l2-5L5.5 3 11 9.5 8 10l-1 4zM11 3l1 2 2 1-2 1-1 2-1-2-2-1 2-1 1-2z"/></svg>
    </button>
    <button class="icon-btn" id="btn-settings" title="设置" aria-label="打开设置">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.3 3.3l1.4 1.4M11.3 11.3l1.4 1.4M12.7 3.3l-1.4 1.4M4.7 11.3l-1.4 1.4"/></svg>
    </button>
  </div>

  <div id="main">

    <!-- 左栏：项目与草稿 -->
    <div id="sidebar">
      <div class="side-head">
        <button id="btn-new-proj">＋ 新建项目</button>
        <button id="btn-fold" title="收起/展开侧栏">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>
        </button>
      </div>
      <div class="side-inner" id="side-list"></div>
    </div>

    <!-- 中间：写作区 -->
    <div id="doc">
      <div id="doc-scroll">
        <div id="doc-inner">
          <div id="empty">
            <h1>今天想写点什么？</h1>
            <p>从左侧选择一篇草稿继续，或新建一篇。</p>
          </div>
          <div id="article"></div>
        </div>
      </div>
    </div>

    <!-- 右栏：写作助手面板 -->
    <div id="tools">
      <div class="tools-pad">
        <div id="panel-head">
          <span class="pt">写作助手</span>
          <span class="pstatus"><span class="pdot"></span>草稿</span>
        </div>
        <div id="cardflow">
          <div class="insight">
            <div class="ins-head">
              <span class="ins-ic">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 2v1.5M8 12.5V14M2 8h1.5M12.5 8H14M4 4l1 1M11 11l1 1M12 4l-1 1M5 11l-1 1"/><circle cx="8" cy="8" r="2.6"/></svg>
              </span>
              <span class="ins-t">当前洞察</span>
              <span class="ins-badge">AI 接入后启用</span>
            </div>
            <div class="ins-row"><span class="k">状态</span><span class="v">第一阶段的 AI 建议在下一阶段接入</span></div>
          </div>
        </div>
        <div id="ask-mini">
          <input id="ask-input" placeholder="问点什么…" autocomplete="off">
          <button id="ask-send">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
          </button>
        </div>
        <div id="tool-dock">
          <button class="dock-btn" id="tool-rw">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2l3 3L5.5 13.5 2 14l.5-3.5L11 2z"/></svg>
            <span class="dn">改写</span>
          </button>
          <button class="dock-btn" id="tool-sr">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
            <span class="dn">搜索</span>
          </button>
          <button class="dock-btn" id="tool-ck">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4.5L6.5 11 3 7.5"/><circle cx="8" cy="8" r="6.5"/></svg>
            <span class="dn">核验</span>
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- 设置弹窗 -->
<div id="settings-modal" class="modal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-card">
    <div class="modal-head"><span id="modal-title">模型设置</span> <button id="modal-close" aria-label="关闭设置">×</button></div>
    <label>选择服务商（自动填好地址和模型名）</label>
    <div class="presets" id="presets">
      <button class="preset" data-p="deepseek">DeepSeek</button>
      <button class="preset" data-p="openai">OpenAI</button>
      <button class="preset" data-p="qwen">通义千问</button>
      <button class="preset" data-p="kimi">Kimi</button>
      <button class="preset" data-p="zhipu">智谱 GLM</button>
      <button class="preset" data-p="custom">自定义</button>
    </div>
    <label>API 地址（Base URL，OpenAI 兼容）</label>
    <input id="set-base" placeholder="https://api.deepseek.com/v1">
    <label>模型名</label>
    <input id="set-model" placeholder="deepseek-chat">
    <label>API Key（留空 = 保留原 Key）</label>
    <input id="set-key" type="password" placeholder="sk-...">
    <div class="sec-divider"></div>
    <div class="sec-title">作者偏好（会注入 AI 上下文，可随时删除）</div>
    <div id="prefs-list"></div>
    <div class="pref-add">
      <input id="pref-key" placeholder="偏好名，如：文风" maxlength="20">
      <input id="pref-content" placeholder="内容，如：多用短句" maxlength="50">
      <button id="pref-add-btn" class="mini2">记住</button>
    </div>
    <div class="sec-divider"></div>
    <div class="sec-title">模型配置（按任务绑定不同模型）</div>
    <div id="profiles-list"></div>
    <div class="pref-add">
      <input id="pf-name" placeholder="名称" maxlength="16">
      <input id="pf-base" placeholder="https://api.deepseek.com/v1" style="width:150px">
      <input id="pf-model" placeholder="模型名" maxlength="24">
      <input id="pf-key" type="password" placeholder="API Key">
      <button id="pf-add-btn" class="mini2">添加</button>
    </div>
    <div class="bind-row" id="bind-row"></div>
    <div class="modal-acts">
      <button class="btn btn-g" id="modal-cancel">取消</button>
      <button class="btn btn-p" id="modal-save">保存</button>
    </div>
    <div class="modal-hint" id="modal-hint">Key 本地加密存储（DPAPI），不会上传。</div>
  </div>
</div>

<div id="toast"></div>
<!-- 窄屏抽屉遮罩 -->
<div id="drawer-mask" style="display:none"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
