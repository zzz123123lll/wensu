name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          python -m pip install -e ".[dev]"

      - name: Backend tests + coverage (fail under 80%)
        run: python -m pytest -q --cov=app --cov-report=term

      - name: Python lint
        run: python -m ruff check .

      - name: JS syntax
        shell: pwsh
        run: |
          Get-ChildItem -Path web -Recurse -Filter *.js | Where-Object { $_.FullName -notmatch 'node_modules' } | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit 1 } }

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Vitest
        working-directory: web
        run: npx vitest run

      - name: Playwright install (system Chrome)
        run: npx playwright install chrome --with-deps

      - name: Playwright mock E2E
        working-directory: web
        run: npx playwright test

      # 普通分支/PR：预发布门禁（不要求 tag）
      - name: Release gate (pre-release)
        if: startsWith(github.ref, 'refs/tags/v') != true
        run: python scripts/release_gate.py --pre-release --allow-dirty --skip-web

      # tag 对应干净提交：正式门禁（含前端全量）
      - name: Release gate (final)
        if: startsWith(github.ref, 'refs/tags/v') == true
        run: python scripts/release_gate.py

      - name: Upload release manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: dist/release-manifest.json
          if-no-files-found: ignore
