[project]
name = "wensu"
version = "0.1.0"
description = "文序 · AI 原生写作系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "python-docx>=1.1.0",
    "beautifulsoup4==4.13.4",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff>=0.6.0",
]

[project.scripts]
wensu = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.review" = ["packs/*.json", "*.txt"]

[tool.setuptools.data-files]
"web" = ["web/index.html", "web/style.css"]
"web/js" = ["web/js/*.js"]
"web/js/review" = ["web/js/review/*.js", "web/js/review/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
skip_covered = true

[tool.ruff.lint]
# 门禁：核心正确性规则（未定义名称/未使用导入/语法级问题）；风格规则不强制
select = ["E4", "E7", "E9", "F"]
